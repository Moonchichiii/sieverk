name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Warnings are errors in CI. Locally you can iterate with warnings;
      # nothing lands on main carrying them.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is not decoration: development happens on Windows,
        # and this job is also the canary for fixture line-ending mangling —
        # if .gitattributes ever stops protecting the CP437 fixtures, the
        # Windows checkout breaks the tests here before it breaks your day.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      # Smoke test: the real binary against the real fixture, end to end.
      - run: cargo run -- fixtures/minimal_valid.se
      # Masterdata smoke: the tracked synthetic root must load (SV-02).
      - run: cargo run -- inspect-masterdata --root fixtures/masterdata/synthetic/generated

  masterdata:
    name: masterdata (synthetic regeneration is a no-op)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      # The tracked synthetic artefacts must be exactly what the generator
      # produces from the tracked workbook (V14). REAL masterdata is never
      # touched here — it is gitignored and verified locally by Mats.
      - run: >-
          uv run --with openpyxl tools/mastermatris_gen.py
          --root fixtures/masterdata/synthetic
          --workbook fixtures/masterdata/synthetic/Mastermatris_v1.2-synthetic.xlsx
          --taxonomy masterdata/taxonomy-1.0.json
          --k1-list masterdata/vibeke-k1-lista-2026-08-11.json
          --out fixtures/masterdata/synthetic/generated
          --draft
      - run: git diff --exit-code -- fixtures/masterdata/synthetic/generated
      - run: uv run tools/tests/make_invalid_fixtures.py
      - run: git diff --exit-code -- fixtures/masterdata/synthetic/invalid
      # Every tracked broken root must be refused by the real binary.
      - run: |
          for root in fixtures/masterdata/synthetic/invalid/*/; do
            if cargo run --quiet -- inspect-masterdata --root "$root"; then echo "$root loaded but must fail"; exit 1; fi
          done
      - run: uv run --with openpyxl --with pytest pytest tools/tests -q
